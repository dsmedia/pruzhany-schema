name: ci

# Runs the repo's one verify entry point, bin/verify, verbatim. Its `scan`
# step runs in gitleaks.yml, which keeps a wider trigger (every push to every
# branch); this workflow runs the other steps, so the two together run exactly
# `bin/verify` and the history is scanned once per push, not twice. The steps
# before it only install the tools it needs, at the versions mise.toml pins.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"

      - run: bin/verify zod pydantic
