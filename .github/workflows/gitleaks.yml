name: gitleaks

# The scan step of bin/verify (the repo's one verify entry point), run
# verbatim. It lives in its own workflow because it keeps a wider trigger than
# ci.yml: every push to every branch, not only main and pull requests.
# ci.yml runs the remaining steps, so together the two run exactly `bin/verify`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The scan covers the full history.
          fetch-depth: 0

      - name: Install gitleaks 8.24.3
        run: |
          curl -sL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: bin/verify scan
