# One time: keep each branch listed below as a tag archive/<branch>, then delete the branch;
# then remove this file. The owner's "Yes" of 29 October 2026 to saving what the leftover
# branches alone held and deleting them (pruzhany-steps .scratch/branch-salvage/findings.md).
# A branch is touched only if its tip is still the commit listed and no open pull request uses it.
name: Archive and delete leftover branches (one time)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tag and delete each listed branch that has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
            --json headRefName,baseRefName --jq '.[] | .headRefName, .baseRefName')
          while read -r branch sha; do
            [ -n "$branch" ] || continue
            tip=$(git ls-remote "$REMOTE" "refs/heads/$branch" | cut -f1)
            if [ -z "$tip" ]; then
              echo "already gone: $branch"
            elif [ "$tip" != "$sha" ]; then
              echo "kept $branch: its tip moved to $tip"
            elif grep -qxF "$branch" <<<"$open"; then
              echo "kept $branch: an open pull request uses it"
            else
              if ! git ls-remote "$REMOTE" "refs/tags/archive/$branch" | grep -q .; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/archive/$branch" -f sha="$sha" >/dev/null
              fi
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "archived and deleted $branch"
            fi
          done <<'LIST'
          ccr-234a1360-09ng81 8fc5be974ed611d0a03db12c7c04419b3fd34f7d
          ccr-576e1ba2-g2rc9n 1d65ee37a0feab811c35f02b197eee4131b6eb35
          ccr-a98f64cb-fj2okz 7b7da40da2b0082efe55d4d585e3004ab95e497c
          codex/learn-notice 60af6bbb64e6575568d6c64505686676ed73c168
          codex/linkml-rdf e49f45c5f2bfcb7dac7118c98d03c518b11075fe
          codex/linkml-stage-one 8cf86b42ecdc5831f115a5b38ea072d4e07ce7ab
          codex/linkml-stage-two a2be72524ad0420fe8ce1a64c34c63fb5ef8774b
          standards/ehri-rico-alignment 04e0ed888e4af492f2879ee30c5229b2ca1c2e52
          LIST
