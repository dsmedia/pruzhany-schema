name: fresh-clone

# GitHub workflow syntax (schedule, path filters and bash), read 1 November 2026:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
on:
  schedule:
    - cron: '23 5 * * 1' # Weekly, Monday UTC.
  workflow_dispatch:
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - CHANGELOG.md
      - .github/workflows/fresh-clone.yml
      - bin/**
      - tests/documentation/**
      - mise.toml
      - package.json
      - bun.lock

permissions:
  contents: read

concurrency:
  group: fresh-clone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-start:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      # Release page read 1 November 2026: https://github.com/actions/checkout/releases/tag/v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # bin/verify scan checks the complete history.

      # Same Bun and uv setup/pins as ci.yml; release pages read 1 November 2026:
      # https://github.com/oven-sh/setup-bun/releases/tag/v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
          no-cache: true

      # https://github.com/astral-sh/setup-uv/releases/tag/v8.3.2 (read 1 November 2026)
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.13'
          enable-cache: false

      # Release page and action inputs read 1 November 2026:
      # https://github.com/jdx/mise-action/releases/tag/v5.2.5
      # https://github.com/jdx/mise-action/blob/v5.2.5/action.yml
      # mise release: https://github.com/jdx/mise/releases/tag/v2026.10.25 (same day)
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.25'
          install: false # The README's mise install must do the installation.
          cache: false

      - name: Record runner tools
        run: |
          set -euo pipefail
          bash --version
          git --version
          node --version
          mktemp --version
          bun --version
          uv --version
          mise --version

      - name: Run the README quick start verbatim
        run: |
          set -euo pipefail
          bun bin/extract-quick-start.ts README.md > "$RUNNER_TEMP/quick-start.sh"
          bash -euo pipefail "$RUNNER_TEMP/quick-start.sh"
