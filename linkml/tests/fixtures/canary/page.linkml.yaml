id: https://w3id.org/pruzhany/schema/page
name: pruzhany_page
title: Pruzhany newspaper — physical page
description: >-
  Pages, blocks and (proposed) lines and words of the Pruzhany newspaper.
  One definition; JSON Schema, Pydantic, TypeScript, SHACL and docs are generated from it.
version: 0.1.0-trial
license: CC-BY-NC-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  pruz: https://w3id.org/pruzhany/schema/
  schema: http://schema.org/
default_prefix: pruz
default_range: string
imports:
  - linkml:types

types:
  IsoDate:
    typeof: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: A calendar date written YYYY-MM-DD.

classes:
  Box:
    description: >-
      A rectangle in pixels of the page image. Named parts, not a list, so it survives
      linked data (an RDF list loses order and repeated numbers). Written for IIIF and
      Web Annotation as xywh=x,y,w,h.
    attributes:
      x: {range: integer, required: true, minimum_value: 0}
      y: {range: integer, required: true, minimum_value: 0}
      w: {range: integer, required: true, minimum_value: 1}
      h: {range: integer, required: true, minimum_value: 1}
  PagesData:
    tree_root: true
    description: One edition's pages file (static/data/<date>-pages.json).
    attributes:
      edition_date:
        range: IsoDate
        required: true
      pages:
        range: Page
        multivalued: true
        inlined_as_list: true
        required: true

  Page:
    description: A newspaper page with its blocks.
    class_uri: schema:CreativeWork
    attributes:
      id:
        identifier: true
        pattern: "^pruz:page-\\d{4}-\\d{2}-\\d{2}-\\d+$"
        description: Page id, e.g. page-1938-12-16-4.
      issue_date:
        range: IsoDate
        required: true
      page_number:
        range: integer
        required: true
        minimum_value: 1
      image_uri:
        required: true
        description: Where the page picture is.
      dimensions:
        range: integer
        multivalued: true
        minimum_cardinality: 2
        maximum_cardinality: 2
        minimum_value: 1
        required: true
        description: "[width, height] in pixels."
      blocks:
        range: Block
        multivalued: true
        inlined_as_list: true
        required: true

  Block:
    description: A physical region of print on a page.
    annotations:
      impresso: page file r[] (region)
      alto: TextBlock
      page_xml: TextRegion
    attributes:
      id:
        identifier: true
        description: Block id, e.g. blk-p4-001.
      bbox:
        range: Box
        inlined: true
        required: true
        description: The region's box in pixels of the page image.
      transcription:
        required: true
      confidence:
        range: float
        minimum_value: 0
        maximum_value: 1
      image_crop:
        description: Path to a cropped picture of the block, if any.
      unit_id:
        description: The content item (piece) this block belongs to, or null.
      lines:
        range: Line
        multivalued: true
        inlined_as_list: true
        description: PROPOSED — the line layer, today rebuilt by run_paper but not published.

  Line:
    description: PROPOSED — one printed line.
    annotations:
      impresso: page file r[].p[].l[]
      alto: TextLine
    attributes:
      bbox:
        range: Box
        inlined: true
        required: true
        description: The region's box in pixels of the page image.
      words:
        range: Word
        multivalued: true
        inlined_as_list: true
        required: true

  Word:
    description: PROPOSED — one printed word, boxed on its own ink.
    annotations:
      impresso: page file r[].p[].l[].t[] (c = box, tx = text)
      alto: String
    attributes:
      bbox:
        range: Box
        inlined: true
        required: true
        description: The region's box in pixels of the page image.
      text:
        required: true
      confidence:
        range: float
        minimum_value: 0
        maximum_value: 1
      trust:
        range: TrustLevel
      joined:
        description: The whole word when this one is broken over a line end.

enums:
  TrustLevel:
    description: How well a word, line or piece has been checked.
    permissible_values:
      machine:
        description: As the machine read it.
      model_checked:
        description: Checked by a model.
      person_checked:
        description: Checked by a person.
