id: https://pruzhany.org/ns/fixture-exact-cardinality
name: fixture_exact_cardinality
description: A page whose dimensions use exact_cardinality, which gen-json-schema drops.
prefixes:
  linkml: https://w3id.org/linkml/
  pc: https://pruzhany.org/ns/sourced-entities#
default_prefix: pc
default_range: string
imports:
  - linkml:types
classes:
  Page:
    description: A page.
    attributes:
      dimensions:
        range: integer
        multivalued: true
        exact_cardinality: 2  # refused here
        description: Width and height.
