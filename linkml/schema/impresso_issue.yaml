# Impresso README and schemas; LinkML JSON Schema, Slots, Advanced features and Arrays
# https://linkml.io/linkml/schemas/arrays.html, read 31 October 2026.
# Upstream field descriptions: Impresso team, AGPL-3.0-or-later; see standards/impresso-329323c.
id: https://pruzhany.org/ns/impresso_issue
name: pruzhany_impresso_issue
title: Impresso canonical issue external contract
description: External Impresso wire contract. Every published field is described; no stored field
  is added. Unknown object properties remain allowed. Annotations preserve JSON unions and nulls
  independently of requiredness; native LinkML validation alone is not the oracle.
prefixes:
  linkml: https://w3id.org/linkml/
  pc: https://pruzhany.org/ns/sourced-entities#
default_prefix: pc
default_range: string
imports:
- linkml:types
see_also:
- https://impresso.github.io/impresso-schemas/json/canonical/issue.schema.json
annotations:
  json_schema_nulls: explicit
  sources_read: '31 October 2026: impresso/impresso-schemas master 329323c, README.md and the unchanged
    three schemas in standards/impresso-329323c; LinkML JSON Schema, Slots, Advanced features and
    Arrays documentation. Impresso governs under ADR 0001; these are format correspondences, not
    ontology equivalences.'
classes:
  ImpressoIssue:
    extra_slots:
      allowed: true
    description: Logical representation of the contents of a canonical issue (newspaper or broadcast).
    annotations:
      impresso: issue
    attributes:
      id:
        required: true
        description: Canonical ID of the newspaper or radio broadcast issue (e.g. GDL-1900-01-02-a,
          or SOC_CJ-1940-07-22-a)
        annotations:
          impresso: issue.id
        pattern: ^[A-Za-z][A-Za-z0-9_]*-\d{4}-\d{2}-\d{2}-[a-z]{1,2}$
      cdt:
        description: Creation date timestamp (of the JSON file).
        annotations:
          impresso: issue.cdt
      ts:
        description: Creation date timestamp (in '%Y-%m-%dT%H:%M:%SZ' format). If consolidated==True,
          this is the consolidated timestamp (the original creation timestamp can be found in consolidated_timestamp_original);
          otherwise it is the original creation timestamp.
        annotations:
          impresso: issue.ts
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      st:
        description: Type of media source. Should be a value the impresso-essentials.utils SourceType
          enum.
        annotations:
          impresso: issue.st
        equals_string_in:
        - newspaper
        - radio_broadcast
        - radio_magazine
        - radio_schedule
        - monograph
        - encyclopedia
      sm:
        description: Source medium, format in which the media was originally produced. If `tp ==
          radio_broadcast`, this is typically `typescript` or `audio`.
        annotations:
          impresso: issue.sm
        equals_string_in:
        - print
        - typescript
        - audio
      consolidated:
        description: True if this issue is consolidated, and contains additional language identification
          and ocrqa information.
        annotations:
          impresso: issue.consolidated
        range: boolean
      consolidated_ts_original:
        description: Creation date timestamp (in '%Y-%m-%dT%H:%M:%SZ' format) of the original issue
          which was consolidated into this object. Only defined if `consolidated==True`.
        annotations:
          impresso: issue.consolidated_ts_original
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      media_title_variant:
        description: Variant title of the media title this CI is from (mainly in the case of BL newspapers).
          The field is present only when a meaningful variant title is available.
        annotations:
          impresso: issue.media_title_variant
          json_min_length: 1
      olr:
        description: True if optical layout recognition was applied to the issue/bulletin this content
          item originates from.
        annotations:
          impresso: issue.olr
        range: boolean
      content_items:
        required: true
        alias: i
        description: The content item(s) contained in the newspaper/radio_broadcast issue. Upstream
          places required m on the array, where JSON Schema does not apply it; the entry metadata
          is therefore optional.
        annotations:
          impresso: issue.i
        multivalued: true
        range: ImpressoIssueItem
        inlined_as_list: true
      styles:
        alias: s
        description: "The text style as defined in the OCR output. \nEach style consists of:\n -\
          \ a name (`id`)\n - a type-face (`f`)\n - a font-size (`fs`)\n - a color (`rgb`)."
        annotations:
          impresso: issue.s
        multivalued: true
        range: ImpressoStyle
        inlined_as_list: true
      pp:
        description: Canonical IDs of pages in the issue, without file extension (e.g. GDL-1900-01-02-a-p0004).
          In the case `sm` is in [`print`, `typescript`].
        annotations:
          impresso: issue.pp
        multivalued: true
        pattern: ^[A-Za-z][A-Za-z0-9_]*-\d{4}-\d{2}-\d{2}-[a-z]{1,2}-p[0-9]{4}$
      rr:
        description: Canonical ID of audio record of the issue (in list for consistency), without
          file extension (e.g. INA-1900-01-02-a-r0004). In the case `sm`==`audio`.
        annotations:
          impresso: issue.rr
        multivalued: true
        pattern: ^[A-Za-z][A-Za-z0-9_]*-\d{4}-\d{2}-\d{2}-[a-z]{1,3}-r[0-9]{4}$
      notes:
        alias: n
        description: Notes.
        annotations:
          impresso: issue.n
          json_types: string,array
      iiif_manifest_uri:
        description: URI for the issue's manifest in the IIIF Presentation API. The field is present
          only when a meaningful URI is available.
        annotations:
          impresso: issue.iiif_manifest_uri
          json_min_length: 1
      is_exact_date:
        description: False if the date assigned to the issue is known to be inexact or approximated,
          True or undefined otherwise.
        annotations:
          impresso: issue.is_exact_date
        range: boolean
      rc:
        description: Radio channel, if applicable (st=='radio_broadcast'). The field is present only
          when a meaningful value is available.
        annotations:
          impresso: issue.rc
          json_min_length: 1
      rp:
        description: Radio program if applicable (st=='radio_broadcast'). The field is present only
          when a meaningful program name is available.
        annotations:
          impresso: issue.rp
          json_min_length: 1
      provided_metadata:
        description: Minimally preprocessed issue-level metadata included by the provider institution,
          especially useful for radio data (sm=audio).
        annotations:
          impresso: issue.provided_metadata
          json_types: object,array
    rules:
    - preconditions:
        slot_conditions:
          sm:
            required: true
      postconditions:
        slot_conditions:
          st:
            required: true
    - preconditions:
        slot_conditions:
          st:
            required: true
      postconditions:
        slot_conditions:
          sm:
            required: true
    - preconditions:
        slot_conditions:
          sm:
            required: true
            equals_string_in:
            - typescript
            - print
      postconditions:
        slot_conditions:
          pp:
            required: true
    - preconditions:
        slot_conditions:
          sm:
            required: true
            equals_string: audio
      postconditions:
        slot_conditions:
          rr:
            required: true
    - preconditions:
        slot_conditions:
          sm:
            required: true
            equals_string: print
      postconditions:
        slot_conditions:
          olr:
            required: true
    any_of:
    - slot_conditions:
        ts:
          required: true
    - slot_conditions:
        cdt:
          required: true
    tree_root: true
  ImpressoIssueItem:
    extra_slots:
      allowed: true
    description: A content item (e.g. article, advertisement, radio broadcast, etc.)
    annotations:
      impresso: issue.i[]
    attributes:
      metadata:
        alias: m
        description: Metadata about the content item.
        annotations:
          impresso: issue.i[].m
        range: ImpressoMetadata
        inlined: true
      coordinates:
        alias: c
        description: 'Coordinates (xywh format or [HPOS, VPOS, WIDTH, HEIGHT]) of image-region corresponding
          to the content-item depending on its type (if `tp == image`). NOTE: the ''null'' option
          should be removed to prevent tables from having coordinates.'
        annotations:
          impresso: issue.i[].c
          nullable: true
        multivalued: true
        minimum_cardinality: 4
        range: integer
      legacy:
        alias: l
        description: Legacy sections or components of the content item in the original OCR/OLR. They
          are meant to enable the reassignation of Impresso CIs (and enrichments) to the original
          OCR/OLR files.
        annotations:
          impresso: issue.i[].l
        range: ImpressoLegacy
        inlined: true
      part_of:
        alias: pOf
        description: Article/content-item to which the image is attached (if `tp == image`).
        annotations:
          impresso: issue.i[].pOf
          nullable: true
      section_title:
        description: A section title grouping content items, with its original OCR components.
        annotations:
          impresso: issue.i[].section_title
        range: ImpressoIssueSection
        inlined: true
  ImpressoMetadata:
    extra_slots:
      allowed: true
    description: Metadata for an entry in the canonical issue, including its page or audio references.
    annotations:
      impresso: issue.$defs.metadata
    attributes:
      id:
        required: true
        description: Content item ID (e.g. `GDL-1900-01-02-a-i0001`).
        annotations:
          impresso: issue.$defs.metadata.id
        pattern: ^[A-Za-z][A-Za-z0-9_]*-\d{4}-\d{2}-\d{2}-[a-z]{1,2}-i[0-9]{4}$
      lg:
        required: true
        description: Language of the content item.
        annotations:
          impresso: issue.$defs.metadata.lg
          nullable: true
      deprecated_language:
        alias: l
        description: Language of the content item (deprecated).
        annotations:
          impresso: issue.$defs.metadata.l
      consolidated_reocr_applied:
        description: True if the CI's text went through the re-OCRisation process. Only defined if
          `consolidated==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_reocr_applied
        range: boolean
      consolidated_reocr_run_id:
        description: Run ID corresponding to the re-OCR process. Only defined if `consolidated==True`
          and `consolidated_re_ocr_applied==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_reocr_run_id
      consolidated_reocr_model_id:
        description: Model ID or name corresponding to the re-OCR process. Only defined if `consolidated==True`
          and `consolidated_re_ocr_applied==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_reocr_model_id
      consolidated_ocrqa:
        description: Estimated OCR quality, between 0 and 1. May be null if there is no text or not
          enough text to compute an estimate. Only defined if `consolidated==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_ocrqa
          nullable: true
        range: double
        minimum_value: 0
        maximum_value: 1
      consolidated_char_len:
        description: Character count of the consolidated text for the content item. May be null if
          there is no text. Only defined if `consolidated==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_char_len
          nullable: true
        range: integer
        minimum_value: 0
      lg_original:
        description: Language of the content item in the original OCR/OLR. Only defined if `consolidated==True`.
        annotations:
          impresso: issue.$defs.metadata.lg_original
          nullable: true
      consolidated_lg:
        pattern: '^[a-z]{2,3}$'
        description: Computed language of the content item. Only defined if `consolidated==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_lg
          nullable: true
      consolidated_langident_run_id:
        description: Run ID corresponding to the lang ID process used to obtain the `consolidated_language`
          value. Only defined if `consolidated==True`.
        annotations:
          impresso: issue.$defs.metadata.consolidated_langident_run_id
      pp:
        description: Page numbers over which the content item spans, in the case `sm` is in [`print`,
          `typescript`].
        annotations:
          impresso: issue.$defs.metadata.pp
        multivalued: true
        range: integer
      rr:
        description: Record numbers over which the content item spans, in the case `sm` is `audio`.
        annotations:
          impresso: issue.$defs.metadata.rr
        multivalued: true
        range: integer
      title:
        alias: t
        description: Title of the content item. The field is present only when a meaningful title
          is available.
        annotations:
          impresso: issue.$defs.metadata.t
          json_min_length: 1
      tp:
        required: true
        description: Type of the content item.
        annotations:
          impresso: issue.$defs.metadata.tp
        equals_string_in:
        - article
        - ad
        - image
        - table
        - death_notice
        - weather
        - page
        - radio_bulletin
        - radio_broadcast_episode
        - chronicle
        - chapter
        - discussion
        - entertainment
      iiif_link:
        description: 'IIIF image link, depending on content item type (if `tp == image`). The field
          is present only when a meaningful link is available. It should follow the format: ''{scheme}://{server}/{prefix}/{identifier}/info.json''.'
        annotations:
          impresso: issue.$defs.metadata.iiif_link
          json_min_length: 1
      ro:
        description: Reading order index of the content item, for the table of contents view on the
          interface. If not defined, the CI number (after 'i' in the ID) should be used.
        annotations:
          impresso: issue.$defs.metadata.ro
        range: integer
      speakers:
        description: List of speakers (names or IDs based on availabilities) within boradcast.
        annotations:
          impresso: issue.$defs.metadata.speakers
          json_item_types: object,string
        multivalued: true
      var_t:
        description: Deprecated, replaced by `media_title_variant` at issue's top-level. Variant
          title of the media title this CI is from (only in the case of BL newspapers). The field
          is present only when a meaningful variant title is available.
        annotations:
          impresso: issue.$defs.metadata.var_t
          json_min_length: 1
      archival_note:
        description: Plaintext archival note or description concerning the content item. In case
          of audio radio broadcasts, this corresponds to the content summary provided with the metadata.
          The field is present only when a meaningful note is available.
        annotations:
          impresso: issue.$defs.metadata.archival_note
          json_min_length: 1
    rules:
    - preconditions:
        slot_conditions:
          consolidated_reocr_run_id:
            required: true
      postconditions:
        slot_conditions:
          consolidated_reocr_applied:
            required: true
          consolidated_ocrqa:
            required: true
          consolidated_char_len:
            required: true
    - preconditions:
        slot_conditions:
          consolidated_lg:
            required: true
      postconditions:
        slot_conditions:
          consolidated_langident_run_id:
            required: true
    exactly_one_of:
    - slot_conditions:
        pp:
          required: true
    - slot_conditions:
        rr:
          required: true
  ImpressoLegacy:
    extra_slots:
      allowed: true
    description: Legacy sections or components of the content item in the original OCR/OLR. They
      are meant to enable the reassignation of Impresso CIs (and enrichments) to the original OCR/OLR
      files.
    annotations:
      impresso: issue.i[].l
    attributes:
      id:
        description: ID of the sections or components used to compose the CI in the original OCR/OLR
          files.
        annotations:
          impresso: issue.i[].l.id
          json_types: string,array
      parts:
        description: List of parts of the given section or components. Exact contents can vary, will
          typically be composed of the metadata at disposal in the OCR/OLR.
        annotations:
          impresso: issue.i[].l.parts
        multivalued: true
        range: ImpressoLegacyPart
        inlined_as_list: true
      source:
        description: Source image or OCR/OLR file name.
        annotations:
          impresso: issue.i[].l.source
          json_types: string,array
  ImpressoLegacyPart:
    extra_slots:
      allowed: true
    description: One original OCR component retained for tracing a content item back to its source.
    annotations:
      impresso: issue.$defs.legacy_part_item
    attributes:
      comp_role:
        description: Role of the component part (eg. heading, body, etc).
        annotations:
          impresso: issue.$defs.legacy_part_item.comp_role
          nullable: true
      comp_id:
        description: ID of the part.
        annotations:
          impresso: issue.$defs.legacy_part_item.comp_id
          json_types: string,array
      comp_fileid:
        description: ID of the ALTO file the component comes from.
        annotations:
          impresso: issue.$defs.legacy_part_item.comp_fileid
          json_types: string,array
      comp_page_no:
        description: Page number of the component.
        annotations:
          impresso: issue.$defs.legacy_part_item.comp_page_no
          json_types: integer,array
  ImpressoIssueSection:
    extra_slots:
      allowed: true
    description: A section title grouping content items, with its original OCR components.
    annotations:
      impresso: issue.i[].section_title
    attributes:
      title_text:
        required: true
        description: A section title grouping content items, with its original OCR components.title_text.
        annotations:
          impresso: issue.i[].section_title.title_text
      composing_ci_ids:
        required: true
        description: A section title grouping content items, with its original OCR components.composing_ci_ids.
        annotations:
          impresso: issue.i[].section_title.composing_ci_ids
        multivalued: true
      section_id:
        required: true
        description: A section title grouping content items, with its original OCR components.section_id.
        annotations:
          impresso: issue.i[].section_title.section_id
      heading_legacy_parts:
        required: true
        description: A section title grouping content items, with its original OCR components.heading_legacy_parts.
        annotations:
          impresso: issue.i[].section_title.heading_legacy_parts
        multivalued: true
        range: ImpressoLegacyPart
        inlined_as_list: true
  ImpressoStyle:
    extra_slots:
      allowed: true
    description: One text style from the original OCR, identified locally within the issue.
    annotations:
      impresso: issue.s[]
    attributes:
      rgb:
        description: Color of the text (in RGB).
        annotations:
          impresso: issue.s[].rgb
        multivalued: true
        minimum_cardinality: 3
        range: integer
      font:
        alias: f
        description: Font name
        annotations:
          impresso: issue.s[].f
      fs:
        description: Font size
        annotations:
          impresso: issue.s[].fs
        range: double
      id:
        required: true
        description: Local ID of the style
        annotations:
          impresso: issue.s[].id
        range: integer
