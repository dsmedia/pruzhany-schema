# The types the record's documents share: a pattern or a bound that recurs in the shapes the
# site's documents are checked against, said once. Each pattern is copied character for
# character from the JSON Schema that Zod exports for those documents (made again by
# linkml/export_zod.ts) once JSON's own escapes are undone, and written in single quotes, in
# which YAML keeps every backslash; linkml/tests/test_types.py checks that each still appears
# there. A type a document needs once stays with that document's slot.
id: https://pruzhany.org/ns/types
name: pruzhany_types
title: Shared types of the Pruzhany record
description: >-
  Text, day, digest, language and number types that the record's documents share.
  A document's schema imports this module, which defines no class of its own.
prefixes:
  linkml: https://w3id.org/linkml/
  pc: https://pruzhany.org/ns/sourced-entities#
default_prefix: pc
default_range: string
imports:
  - linkml:types

types:
  NonBlankText:
    typeof: string
    pattern: '\S'
    description: >-
      Text with at least one character that is not white space.
  IsoDay:
    typeof: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: >-
      A calendar day written YYYY-MM-DD, such as 1938-12-16.
  IsoYearMonthOrDay:
    typeof: string
    pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
    description: >-
      A year, a month or a day, as far as it is known: YYYY, YYYY-MM or YYYY-MM-DD.
  Sha256Hex:
    typeof: string
    pattern: '^[0-9a-f]{64}$(?![\s\S])'
    description: >-
      A SHA-256 digest: exactly 64 lowercase hexadecimal digits and nothing after them. Some
      shapes write the pattern without its last part and add a length of 64, which says the
      same; LinkML has no length of a string, hence the last part.
  LanguageTag:
    typeof: string
    pattern: '^(?:[A-Za-z]{2,3}(?:-[A-Za-z]{3}){0,3}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|[0-9]{3}))?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[0-9A-WY-Za-wy-z](?:-[A-Za-z0-9]{2,8})+)*(?:-[xX](?:-[A-Za-z0-9]{1,8})+)?|[A-Za-z]{4,8}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|[0-9]{3}))?(?:-(?:[A-Za-z0-9]{5,8}|[0-9][A-Za-z0-9]{3}))*(?:-[0-9A-WY-Za-wy-z](?:-[A-Za-z0-9]{2,8})+)*(?:-[xX](?:-[A-Za-z0-9]{1,8})+)?|[xX](?:-[A-Za-z0-9]{1,8})+|[eE][nN]-[gG][bB]-[oO][eE][dD]|[iI]-(?:[aA][mM][iI]|[bB][nN][nN]|[dD][eE][fF][aA][uU][lL][tT]|[eE][nN][oO][cC][hH][iI][aA][nN]|[hH][aA][kK]|[kK][lL][iI][nN][gG][oO][nN]|[lL][uU][xX]|[mM][iI][nN][gG][oO]|[nN][aA][vV][aA][jJ][oO]|[pP][wW][nN]|[tT][aA][oO]|[tT][aA][yY]|[tT][sS][uU])|[sS][gG][nN]-(?:[bB][eE]-[fF][rR]|[bB][eE]-[nN][lL]|[cC][hH]-[dD][eE])|[aA][rR][tT]-[lL][oO][jJ][bB][aA][nN]|[cC][eE][lL]-[gG][aA][uU][lL][iI][sS][hH]|[nN][oO]-[bB][oO][kK]|[nN][oO]-[nN][yY][nN]|[zZ][hH]-[gG][uU][oO][yY][uU]|[zZ][hH]-[hH][aA][kK][kK][aA]|[zZ][hH]-[mM][iI][nN]|[zZ][hH]-[mM][iI][nN]-[nN][aA][nN]|[zZ][hH]-[xX][iI][aA][nN][gG])$'
    description: >-
      A BCP 47 language tag, by the pattern in vocabulary/citation-requirements.json.
  SimpleLanguageTag:
    typeof: string
    pattern: '^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$'
    description: >-
      A language tag in its simple form, letters then hyphenated parts, such as yi or yi-Latn.
  ScriptCode:
    typeof: string
    pattern: '^[A-Za-z]{4}$'
    description: >-
      A four-letter ISO 15924 script code, such as Hebr or Latn.
  HostName:
    typeof: string
    pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    description: >-
      A lowercase internet host name with at least one dot, such as collections.yadvashem.org.
  NonNegativeInteger:
    typeof: integer
    minimum_value: 0
    maximum_value: 9007199254740991
    description: >-
      A whole number from 0 to 9007199254740991, the largest integer JavaScript holds
      exactly. As the range of a multivalued slot it bounds each item, not the list.
  PositiveInteger:
    typeof: integer
    minimum_value: 1
    maximum_value: 9007199254740991
    description: >-
      A whole number from 1 to 9007199254740991; the shapes say above 0, which for a whole
      number is the same.
  NonNegativeNumber:
    typeof: float
    minimum_value: 0
    description: >-
      A number at least 0, such as each of the four numbers of a box on a page picture; the
      shapes bound the box's width and height above 0, which known-looser.yaml records.
