      grandchild_of:
        title: "Grandchild of"
        description: "The subject is grandchild of the related person; direction is descendant to ascendant. The vocabulary ID retains the exact generation; RiC-O DescendanceRelation covers descent across any number of intermediate persons."
        meaning: "rico:hasAncestor"
        annotations:
          via: "rico:DescendanceRelation"
      grandparent_of:
        title: "Grandparent of"
