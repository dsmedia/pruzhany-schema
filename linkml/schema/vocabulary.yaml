        meaning: "rico:hasDescendant"
        annotations:
          via: "rico:DescendanceRelation"
      in_law:
        title: "In-law (Mechutan)"
        description: "The subject is in law of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:hasFamilyAssociationWith"
        annotations:
          via: "rico:FamilyRelation"
      nephew_niece_of:
        title: "Nephew/Niece of"
        description: "The subject is nephew niece of of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:hasFamilyAssociationWith"
