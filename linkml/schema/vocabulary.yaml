          via: "rico:FamilyRelation"
      parent_in_law:
        title: "Parent-in-law"
        description: "The subject is parent in law of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:hasFamilyAssociationWith"
        annotations:
          via: "rico:FamilyRelation"
      parent_of:
        title: "Parent of"
        description: "The subject is parent of of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:hasChild"
        annotations:
          via: "rico:ChildRelation"
      sibling:
        title: "Sibling"
        description: "The subject is sibling of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:hasSibling"
