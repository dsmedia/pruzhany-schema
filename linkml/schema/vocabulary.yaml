# Generated by vocabulary/generate.py from vocabulary/*.json; do not edit.
# Every value is written as JSON, which YAML reads as written.
id: "https://pruzhany.org/ns/vocabulary"
name: "pruzhany_vocabulary"
title: "The vocabulary of the Pruzhany record"
description: "The vocabulary of the record as LinkML enums, one a group, each value with its definition and the RiC-O, EHRI or declared local term it means. Generated by vocabulary/generate.py from vocabulary/sourced-entities.json (1.3.0, released), vocabulary/site-content.json (1.1.0, released) and vocabulary/reading-status.json; never edited by hand."
version: "sourced-entities 1.3.0, site-content 1.1.0"
prefixes:
  linkml: "https://w3id.org/linkml/"
  rico: "https://www.ica.org/standards/RiC/ontology#"
  ehri: "http://lod.ehri-project-test.eu/ontology#"
  pc: "https://pruzhany.org/ns/sourced-entities#"
default_prefix: "pc"
enums:
  FactTypes:
    description: "Fact types: the values of fact_types in vocabulary/sourced-entities.json, version 1.3.0."
    permissible_values:
      birth:
        title: "Birth"
        description: "A sourced birth date; a birth place uses rico:hasBirthPlace independently, including when no date is known."
        meaning: "rico:hasBirthDate"
      death:
        title: "Death"
        description: "A sourced death date; a death place uses rico:hasDeathPlace independently, including when no date is known."
        meaning: "rico:hasDeathDate"
      residence:
        title: "Residence"
        description: "Residence in a place at a specified time."
        meaning: "rico:hasOrHadLocation"
      occupation:
        title: "Occupation"
        description: "An occupation, optionally bounded in time."
        meaning: "rico:hasOrHadOccupationOfType"
      office:
        title: "Office"
        description: "Holding a Position at a time; person occupiesOrOccupied the position, qualified through PositionHoldingRelation."
        meaning: "rico:occupiesOrOccupied"
        annotations:
          via: "rico:PositionHoldingRelation"
      membership:
        title: "Membership"
        description: "A person isOrWasMemberOf a group, inverse of group hasOrHadMember, qualified through MembershipRelation."
        meaning: "rico:isOrWasMemberOf"
        annotations:
          via: "rico:MembershipRelation"
      education:
        title: "Education"
        description: "School attendance or education at a specified time."
        meaning: "pc:fact_types_education"
        comments:
          - "TeachingRelation identifies teaching rather than establishing school attendance; retain attendance without asserting a teacher relationship."
      emigration:
        title: "Emigration"
        description: "A dated departure to live elsewhere; establishes neither death nor survival."
        meaning: "pc:fact_types_emigration"
        comments:
          - "RiC-O MigrationRelation concerns instantiations, not migration of people."
      survival:
        title: "Survival"
        description: "Evidence that a person was alive at a specified time."
        meaning: "pc:fact_types_survival"
        comments:
          - "No dedicated pinned relation expresses evidence of being alive at a time."
      parenthood:
        title: "Parenthood"
        description: "Parenthood of an unnamed child without inventing a person node; claims naming a relative use kinship, and links between identified people use relationships. Deprecated in 1.2.0: represent the child as a person and link each parent by parent_of."
        meaning: "pc:fact_types_parenthood"
        deprecated: "Deprecated in 1.2.0; replaced by parent_of in relationship_types: Replace this fact with a parent_of relation from each parent to the child as a person; use a supplied name when the source does not name the child."
        comments:
          - "Preserves an unnamed child without inventing a person node for a child relation."
      ghetto_role:
        title: "Ghetto role"
        description: "A sourced ghetto activity not expressible as membership or office; use membership or office whenever those fit."
        meaning: "pc:fact_types_ghetto_role"
        comments:
          - "No precise pinned counterpart for residual ghetto activities beyond membership or office."
      partisan_service:
        title: "Partisan service"
        description: "A sourced partisan activity beyond membership or office; use membership or office whenever those fit."
        meaning: "pc:fact_types_partisan_service"
        comments:
          - "No precise pinned counterpart for residual partisan activities beyond membership or office."
      deportation:
        title: "Deportation"
        description: "A sourced forced removal at a date and place; event participation may link its event."
        meaning: "pc:fact_types_deportation"
        comments:
          - "No dedicated pinned term captures forced removal of a person."
      burial:
        title: "Burial"
        description: "A sourced interment, optionally dated and placed; distinct from death."
        meaning: "pc:fact_types_burial"
        comments:
          - "No dedicated pinned term captures interment of a person."
      commemoration:
        title: "Commemoration"
        description: "A sourced act of remembrance; event participation may link its event."
        meaning: "pc:fact_types_commemoration"
        comments:
          - "No dedicated pinned term captures an act of remembrance of a person."
      event_participation:
        title: "Event participation"
        description: "Taking part in an event with an explicit mention role; weddings are events, not marriage facts."
        meaning: "rico:isOrWasParticipantIn"
      other:
        title: "Other"
        description: "An assertion awaiting an owner-approved type; requires a nonempty proposed_type."
        meaning: "pc:fact_types_other"
        comments:
          - "Retains an assertion pending owner approval of a specific type and mapping."
      kinship:
        title: "Kinship"
        description: "A source's statement that the person is related, in a stated way, to a named person who need not be identified"
        meaning: "rico:hasFamilyAssociationWith"
        annotations:
          via: "rico:FamilyRelation"
  RelationshipTypes:
    description: "Relationship types: the values of relationship_types in vocabulary/sourced-entities.json, version 1.3.0."
    permissible_values:
      child_in_law:
        title: "Child-in-law"
        description: "The subject is child in law of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:hasFamilyAssociationWith"
        annotations:
          via: "rico:FamilyRelation"
      child_of:
        title: "Child of"
        description: "The subject is child of of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:isChildOf"
        annotations:
          via: "rico:ChildRelation"
      colleague:
        title: "Colleague"
        description: "The subject is colleague of the related person; direction is subject to related person. The specific relationship is retained by this vocabulary ID even when RiC-O provides only a broader association."
        meaning: "rico:isAgentAssociatedWithAgent"
