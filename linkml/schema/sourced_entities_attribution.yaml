# Stand-in until ticket 03 merges: ticket 03 defines Attribution once, in
# sourced_entities.yaml, and at that merge this file is deleted and the one import of it in
# site_common.yaml is changed to sourced_entities. Until then it holds Attribution alone, as
# both twins shape it (zod/sourced-entities.schema.ts AttributionSchema, a strict object;
# pydantic/sourced_entities.py class Attribution(Strict)), so that site_common.yaml's
# Authorship can say is_a Attribution. It is imported, never listed in modules.json.
id: https://pruzhany.org/ns/sourced_entities_attribution
name: pruzhany_sourced_entities_attribution
title: Attribution (a stand-in until the sourced entities are defined)
description: >-
  Who said something and on which day: the attribution the record's sourced statements and the
  site's supplied titles and translations carry. A stand-in for the sourced entities' module.
prefixes:
  linkml: https://w3id.org/linkml/
  pc: https://pruzhany.org/ns/sourced-entities#
default_prefix: pc
default_range: string
imports:
  - linkml:types
  - types

classes:
  Attribution:
    description: >-
      Who wrote or decided something, and on which day.
    attributes:
      by:
        range: NonBlankText
        required: true
        description: >-
          Who it was: a person's name or the name of the program or model that did it.
      'on':
        range: IsoDay
        required: true
        description: >-
          The day it was done, written YYYY-MM-DD.
      note:
        description: >-
          A remark in words about how it was done, where one was kept.
