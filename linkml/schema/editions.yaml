# The editions catalog (pruzhany-svelte static/data/editions-catalog.json), as
# zod/editions.schema.ts and pydantic/editions.py shape it. Its JSON Schema is made with the
# top class EditionsCatalog (modules.json). Its keys are written in camelCase, which LinkML's
# lint refuses as slot names, so each such slot is named in snake_case and carries the key as
# its alias, which is the property name in the generated JSON Schema.
id: https://pruzhany.org/ns/editions
name: pruzhany_editions
title: The catalog of Pruzhany editions
description: >-
  Every edition of the paper with its Hebrew date, the Jewish holidays and the outside
  historical events the site's calendar shows, and the dates whose editions are on the site.
prefixes:
  linkml: https://w3id.org/linkml/
  pc: https://pruzhany.org/ns/sourced-entities#
  rico: https://www.ica.org/standards/RiC/ontology#
  schema: http://schema.org/
  ehri: http://lod.ehri-project-test.eu/ontology#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
default_prefix: pc
default_range: string
imports:
  - linkml:types
  - types
  - picture_source

classes:
  EditionsCatalog:
    tree_root: true
    description: >-
      The catalog of editions: every edition, the holidays and historical events beside them,
      and the dates available on the site.
    attributes:
      editions:
        range: Edition
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Every edition of the paper, with its Hebrew date.
      holidays:
        range: Holiday
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          The Jewish holidays of the paper's years.
      historical_events:
        alias: historicalEvents
        range: HistoricalEvent
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Events in the world outside the town that the calendar marks.
      available_dates:
        alias: availableDates
        range: IsoDay
        multivalued: true
        required: true
        description: >-
          The dates of the editions whose pages are on the site.
      available_keys:
        alias: availableKeys
        multivalued: true
        pattern: '^(?:[a-z]+-)?\d{4}-\d{2}-\d{2}$(?![\s\S])'
        description: >-
          The keys of the editions whose pages are on the site, each an Edition key: the
          date alone for the first paper, or the paper's code and a hyphen before it for any
          other. Optional for now, because a site on an older schema pin refuses unknown
          fields and the catalogs written so far lack it: this schema comes first, then the
          site's pin, then the writer writes it, and later it becomes required. When present,
          no key appears twice and every key names an edition in editions. The writer
          publishes another paper's editions without reference to availableDates, which holds
          the first paper's dates, so the runtime twins check only that the date-only keys
          equal availableDates as a set. LinkML's generated JSON Schema cannot compare
          values within or across these lists.
      newspapers:
        range: Newspaper
        multivalued: true
        inlined_as_list: true
        slot_uri: pc:catalog_newspapers
        description: >-
          The papers these editions belong to, one entry per source-register id, with
          their default picture credits. When present, every edition's newspaper must
          name one of these ids. The runtime twins enforce id uniqueness and membership;
          LinkML's generated JSON Schema cannot compare values across these lists.

  Newspaper:
    is_a: PictureSource
    class_uri: ehri:RecordSet
    description: >-
      One newspaper in the source register, with its site title, code and default picture
      credit. A page may supply a different credit through picture_source.
    # Read standards/ehri-0.2.0.json: RecordSet subclasses EHRI RecordResource and RiC-O
    # RecordSet. Read rico-1.1.json and rico-1.1-axioms.json: title and conditionsOfUse
    # have literal ranges; standards/ehri-holdings-1.1-1c2325f9/holdings.shex uses them
    # on ehri:RecordSet. id retains the local source-register meaning of pc:site_newspaper; code is a site routing code.
    attributes:
      id:
        range: NonBlankText
        required: true
        slot_uri: pc:site_newspaper
        description: >-
          The paper's source-register id, the same value as Edition.newspaper.
      code:
        range: NonBlankText
        required: true
        pattern: '^[a-z]+$(?![\s\S])'
        slot_uri: pc:newspaper_code
        description: >-
          The paper's lowercase alphabetic code used in site keys and routes.
      title:
        range: NonBlankText
        required: true
        slot_uri: rico:title
        description: >-
          The paper's title as the site shows it.
      rights:
        range: NonBlankText
        slot_uri: rico:conditionsOfUse
        description: >-
          The rights statement for the pictures, as text.
      rights_url:
        range: uri
        slot_uri: pc:picture_rights_url
        description: >-
          The address where the rights statement was read.

  Edition:
    description: >-
      One edition of the paper: its date in the common calendar and in the Hebrew one, and
      the holiday it falls on, if any.
    close_mappings:
      - schema:PublicationIssue
    attributes:
      date:
        range: IsoDay
        required: true
        description: >-
          The edition's date, written YYYY-MM-DD.
      hebrew_date:
        alias: hebrewDate
        required: true
        description: >-
          The edition's date in the Hebrew calendar, written in Hebrew letters.
      hebrew_month:
        alias: hebrewMonth
        range: integer
        required: true
        minimum_value: 1
        maximum_value: 13
        description: >-
          The Hebrew month, by its number from 1 to 13, counted from Nisan.
      hebrew_year:
        alias: hebrewYear
        range: integer
        required: true
        minimum_value: -9007199254740991
        maximum_value: 9007199254740991
        description: >-
          The Hebrew year, such as 5699.
      holiday:
        description: >-
          The holiday the edition falls on or near, where there is one.
      newspaper:
        range: NonBlankText
        required: true
        slot_uri: pc:site_newspaper
        description: >-
          The paper this edition belongs to, by its id in the source register.
        annotations:
          references: Newspaper.id
          impresso: >-
            The media alias carried by Impresso's canonical id. The pinned schemas have
            no separate media-alias property; site_newspaper keeps the source register id.
      key:
        required: true
        pattern: '^(?:[a-z]+-)?\d{4}-\d{2}-\d{2}$(?![\s\S])'
        description: >-
          The edition's key: its date alone for the first paper, or the paper's code and a
          hyphen before that date for any other paper. Its date must equal date; the source
          register supplies the paper's code.
      object_url:
        range: uri
        slot_uri: pc:holding_object_url
        close_mappings:
          - rdfs:seeAlso
        description: >-
          The holder's descriptive page for this one issue.
        # Read standards/ehri-holdings-1.1-1c2325f9/holdings.shex: rdfs:seeAlso IRI.

  Holiday:
    description: >-
      A Jewish holiday on a given day.
    attributes:
      date:
        range: IsoDay
        required: true
        description: >-
          The holiday's day, written YYYY-MM-DD.
      name:
        required: true
        description: >-
          The holiday's name in Latin letters, such as Purim or Pesach.
      hebrew_name:
        alias: hebrewName
        description: >-
          The holiday's name in Hebrew letters, where it is given.

  HistoricalEvent:
    description: >-
      An event in the world outside the town, such as Kristallnacht, on a day or over a span
      of days.
    close_mappings:
      - rico:Event
    attributes:
      date:
        range: IsoDay
        required: true
        description: >-
          The day the event began, written YYYY-MM-DD.
      end_date:
        alias: endDate
        range: IsoDay
        description: >-
          The day the event ended, where it lasted more than a day.
      name:
        required: true
        description: >-
          The event's name in English.
      description:
        required: true
        description: >-
          What happened, in a sentence or two.
